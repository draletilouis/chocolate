<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>No connection · Equator Chocolate</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #0f172a; font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 800; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #475569; }
    button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #f7941d; color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/equator-mark.png" alt="Equator Chocolate">
    <h1>No connection</h1>
    <p>Equator Chocolate keeps every record on the server, so the app needs a connection. Nothing you saved earlier is lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
